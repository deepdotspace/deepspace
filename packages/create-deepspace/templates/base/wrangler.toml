name = "__APP_NAME__"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat", "assets_navigation_has_no_effect"]
main = "worker.ts"

[assets]
directory = "dist"
binding = "ASSETS"
# The asset layer serves what it HAS and invents nothing: a miss reaches the
# worker as a real 404, and src/server/http-routes.ts decides — the app shell
# for a client route, 404 for a file that no longer exists. Under
# "single-page-application" the layer answered BOTH with the shell at 200, so a
# deleted build chunk came back as HTML a script tag then failed to parse.
# The deploy sets the same value; keeping them equal is what makes `deepspace
# dev` route like production.
not_found_handling = "none"
# Without these the asset layer answers first and `not_found_handling` hands
# back the SPA shell — so an unmatched /api/* call gets HTML, and a probe for
# /llms.txt reads the homepage as a published manifest.
#
# This list governs LOCAL DEV only. `deepspace deploy` strips every
# platform-reserved route from it and the deploy worker re-adds them from its
# own baseline, so an app can add routes here but cannot drop these.
run_worker_first = ["/api/*", "/ws/*", "/internal/*", "/v1/*", "/_deepspace/*", "/llms.txt", "/llms-full.txt", "/.well-known/mcp", "/.well-known/mcp.json", "/.well-known/mcp/*"]

# The app's immutable identity (docs: app-identity). `name` above is just the
# subdomain label the next deploy claims; this id never changes — data,
# secrets, and collaborators all key to it. Renames are safe.
[vars]
DEEPSPACE_APP_ID = "__APP_ID__"
APP_NAME = "__APP_NAME__"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppRecordRoom", "AppYjsRoom", "AppCanvasRoom", "AppPresenceRoom", "AppCronRoom", "AppJobRoom"]

[durable_objects]
bindings = [
  { name = "RECORD_ROOMS", class_name = "AppRecordRoom" },
  { name = "YJS_ROOMS", class_name = "AppYjsRoom" },
  { name = "CANVAS_ROOMS", class_name = "AppCanvasRoom" },
  { name = "PRESENCE_ROOMS", class_name = "AppPresenceRoom" },
  { name = "CRON_ROOMS", class_name = "AppCronRoom" },
  { name = "JOB_ROOMS", class_name = "AppJobRoom" },
]

# For per-app resources (D1, KV, Vectorize, R2, Queues, AI Search), set the id
# field to "auto" — DeepSpace provisions and tears down with the deploy.
# Example:
#
# [[d1_databases]]
# binding = "MY_DB"
# database_name = "my-app-db"
# database_id = "auto"
#
# One managed knowledge base per app — upload documents, then search them with
# `knowledge(env)` from deepspace/worker. The instance is never exposed on env;
# the binding name is only the provisioning key:
#
# [[ai_search]]
# binding = "KNOWLEDGE"
# instance_name = "auto"
#
# Full reference, behavior, and pricing:
#   https://docs.deep.space/bindings/knowledge

# --- DeepSpace detected secrets (names only; values live in `npx deepspace secrets`) ---
#   (none declared)
# --- end DeepSpace detected secrets ---

[dev]
port = 8780
inspector_port = 9237
